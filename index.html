<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<style>
    /* * {outline: 2px solid red} */

    body { 
        margin: 0; 
        background: #000; 
        color: #fff; 
        font-family: 'Roboto', sans-serif; 
        display: flex; 
        flex-direction: column; 
        justify-content: space-between; 
        align-items: center; 
        height: 100vh; 
        overflow: clip; 
        padding: 0 0; 
        box-sizing: content-box;
    }

    #date { 
        flex: 1; 
        display: flex; 
        align-items: center; 
        justify-content: center; 
        font-size: 10vmin; 
        color: #aaa; 
        text-transform: capitalize; 
        padding-top: 0vh
    }
    
    #clock-container { 
        flex: 4; 
        display: flex; 
        flex-direction: row; 
        align-items: center; 
        /* Change from center to flex-end to anchor the clock to the right side */
        justify-content: right; 
        width: 100%;
        /* Add a little padding so it doesn't touch the very edge of the screen */
        padding-right: 2%;
        box-sizing: content-box; 
        container-type: size;

    }
    
    #info-container { 
        flex: 1; 
        display: flex; 
        flex-direction: column; 
        justify-content: center; 
        align-items: center; 
    }

    #clock { 
        font-size: 32vmax;
                /* font-size: 110cqh;  */
        font-weight: bold; 
        line-height: 1;
        margin: 0;
        /* font-variant-numeric: tabular-nums; */
    }
    
    /* Seconds are now scaled relative to the same vmin unit */
    #seconds { 
        font-size: 10vmax;  margin-right: 0.1vmax; margin-left: 0.1vmax; color: #ddd; 
        /* Aligns seconds nicely to the baseline of the larger numbers */
        margin-top: 10vmax; 
    }

    #weather { font-size: 5vmin; color: #ccc; }
    #astro { font-size: 5vmin; color: #888; margin-top: 0.5vmin; }
</style>
    <script src="https://cdn.jsdelivr.net/npm/suncalc@1.9.0/suncalc.min.js"></script>
</head>
<body>
    <div id="date">Loading date...</div>
    
    <div id="clock-container">
        <span id="clock">88:88</span><span id="seconds">:88</span>
    </div>

    <div id="info-container">
        <div id="weather">Loading weather...</div>
        <div id="astro">Loading solar data...</div>
    </div>

    <script>
        const lat = 42.5074;
        const lon = -82.9369;
        let lastUpdatedHour = -1; // Initialize a variable to track the last hour we updated the weather


        async function updateWeather() {
            try {
                const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m&daily=temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&forecast_days=1`);
                const data = await response.json();
                document.getElementById('weather').innerText = `Temp: ${Math.round(data.current.temperature_2m)}°F | High: ${Math.round(data.daily.temperature_2m_max[0])}°F | Low: ${Math.round(data.daily.temperature_2m_min[0])}°F`;
                
                const times = SunCalc.getTimes(new Date(), lat, lon);
                document.getElementById('astro').innerText = `Sunrise: ${times.sunrise.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })} | Sunset: ${times.sunset.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`;
            } catch (e) { document.getElementById('weather').innerText = "Weather unavailable"; }
        }

        function updateAll() {
            const now = new Date();
            const h = now.getHours();
            const m = now.getMinutes();
            const s = now.getSeconds();

            // Define trigger hours: 01:00, 06:00, 12:00, 18:00
            const triggerHours = [1, 6, 8, 9, 10, 12, 13, 14, 15, 17, 18];

            if (triggerHours.includes(h) && m === 9 && lastUpdatedHour !== h) {
                    updateWeather();
                    lastUpdatedHour = h; // "Lock" it so it doesn't run again until the hour changes
                }

            // Reset the lock when the hour changes to something outside the trigger list
            // (This ensures that if you restart the app at 1:00, it resets properly)
            if (m !== 0) {
                    lastUpdatedHour = -1;
                }

            let timeString = now.toLocaleTimeString('en-US', { 
                hour: 'numeric',   // Changed from '2-digit' to 'numeric'
                minute: '2-digit', 
                hour12: true 
            });

            // Remove AM/PM for a cleaner look, since we're using 12-hour format without leading zeros
            timeString = timeString.replace(/\s[AP]M$/, "");
            
            // Update the UI
            document.getElementById('date').innerText = now.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            document.getElementById('clock').innerText = timeString;
            document.getElementById('seconds').innerText = ":" + now.getSeconds().toString().padStart(2, '0');
            
            // Background dimming logic
            const times = SunCalc.getTimes(now, lat, lon);
            document.body.style.opacity = (now >= times.sunset || now <= times.sunrise) ? "0.2" : "0.70";
        }

        // Keep the clock running
        setInterval(updateAll, 1000);

        // Run immediately on page load to ensure data is present
        updateAll();
        updateWeather();
        
    </script>
</body>
</html>
