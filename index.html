<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/suncalc@1.9.0/suncalc.min.js" defer></script>

  <style>
    :root{
      --bg: #000;
      --fg: #fff;
      --muted: #aaa;
      --accent: #666;
      --info: #ccc;
      --astro: #888;
      --edge-padding: 4vmin;
      --clock-max: 420px;
      --clock-min: 48px;
    }

    html,body{
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: 'Roboto', system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    /* Layout: column with three rows: date, clock, info */
    body {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: stretch;
      padding: 0;
      box-sizing: border-box;
      transition: background-color 400ms ease, color 400ms ease;
    }

    /* Night/dim state (keeps text readable by changing background rather than opacity) */
    body.dim {
      background: #05050a;
      color: #f6f6f6;
    }

    #date{
      display:flex;
      align-items:center;
      justify-content:center;
      padding: calc(var(--edge-padding) / 2) var(--edge-padding);
      color: var(--muted);
      font-size: clamp(1rem, 4vmin, 2.2rem);
      text-transform: capitalize;
      text-align:center;
    }

    /* Clock container - anchors to the right on wider screens but recenters on narrow */
    #clock-container{
      display:flex;
      justify-content:flex-end;
      align-items:center;
      padding-right: var(--edge-padding);
      width:100%;
      box-sizing:border-box;
    }

    /* Small wrapper so the clock + seconds align on baseline */
    .time-wrap{
      display:flex;
      align-items:baseline; /* aligns seconds to the baseline of the big number */
      gap: 1vmin;
    }

    /* Main time: hours and minutes */
    #clock{
      font-weight:700;
      line-height:1;
      /* responsive font-size with min and max */
      font-size: 32vmax;
      letter-spacing: -0.02em;
      display:inline-block;
      vertical-align: baseline;
    }

    /* Seconds are smaller, aligned to baseline, no huge top margin */
    #seconds{
      font-size: 10vmax;
      color: var(--accent);
      opacity: 0.95;
      display:inline-block;
      vertical-align: baseline;
      transform: translateY(6%);
    }

    /* Info container: weather and astro */
    #info-container{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap: 0.4vmin;
      padding: calc(var(--edge-padding) / 2) var(--edge-padding);
      box-sizing:border-box;
    }

    #weather{ font-size: clamp(0.8rem, 3.2vmin, 1.2rem); color:var(--info); }
    #astro  { font-size: clamp(0.7rem, 3vmin, 1.05rem); color:var(--astro); }

    /* Narrow-screen adjustments: center the clock and reduce huge fonts */
    @media (max-width:720px){
      #clock-container { justify-content:center; padding-right: 8vmin; }
      #clock { font-size: clamp(36px, 40vmin, 260px); }
      .time-wrap { gap: 2vmin; }
      #seconds { transform: translateY(10%); }
    }

    /* Very small phones */
    @media (max-width:380px){
      :root { --edge-padding: 3vmin; }
      #date { font-size: 1rem; }
      #clock { font-size: clamp(28px, 36vmin, 220px); }
      #seconds { font-size: clamp(12px, 8vmin, 44px); }
    }
  </style>
</head>

<body>
  <div id="date">Loading date...</div>

  <div id="clock-container" aria-hidden="false">
    <div class="time-wrap" role="text" aria-label="Current time">
      <span id="clock">0:00</span>
      <span id="seconds">00</span>
    </div>
  </div>

  <div id="info-container" role="contentinfo">
    <div id="weather">Loading weather...</div>
    <div id="astro">Loading solar data...</div>
  </div>

  <script>
    // Location (fixed for now)
  const lat = 42.5074;
  const lon = -82.9369;

  // Elements
  const elDate = document.getElementById('date');
  const elClock = document.getElementById('clock');
  const elSeconds = document.getElementById('seconds');
  const elWeather = document.getElementById('weather');
  const elAstro = document.getElementById('astro');
  const rootBody = document.body;

  // Helper: format time without AM/PM, 12-hour no leading zero on hour
  function formatTime(now){
    const timeString = now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
    // Strip AM/PM, explicitly accounting for standard spaces and modern Narrow No-Break Spaces (\u202F)
    return timeString.replace(/[\s\u202F]*[AP]M/i, "");
  }

  // Weather fetch: open-meteo current and daily (fahrenheit), timezone auto
  async function updateWeather(){
    try {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&daily=temperature_2m_max,temperature_2m_min&timezone=auto&temperature_unit=fahrenheit`;
      const resp = await fetch(url, {cache: "no-store"});
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const data = await resp.json();

      const currentTemp = data.current_weather?.temperature;
      const high = data.daily?.temperature_2m_max?.[0];
      const low  = data.daily?.temperature_2m_min?.[0];

      if (typeof currentTemp === 'number') {
        elWeather.textContent = `Temp: ${Math.round(currentTemp)}°F | High: ${high ? Math.round(high) : '–'}° | Low: ${low ? Math.round(low) : '–'}°`;
      } else {
        elWeather.textContent = "Weather data unavailable";
      }
    } catch (err){
      elWeather.textContent = "Weather unavailable";
    }
  }
// Create a global variable to store the dim state
  let isNightTime = false;

  function updateSolarData(now = new Date()) {
    if (typeof SunCalc !== 'undefined') {
      const times = SunCalc.getTimes(now, lat, lon);
      
      // Update our global state tracking night time
      isNightTime = (now >= times.sunset || now <= times.sunrise);
      rootBody.classList.toggle('dim', isNightTime);

      // Update the text display
      elAstro.textContent = `Sunrise: ${times.sunrise.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'})} | Sunset: ${times.sunset.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'})}`;
    }
  }

  function updateClock(now = new Date()){
    elDate.textContent = now.toLocaleDateString('en-US', { weekday: 'long', year:'numeric', month:'long', day:'numeric' });
    elClock.textContent = formatTime(now);
    elSeconds.textContent = now.getSeconds().toString().padStart(2,'0');

    // Instead of calculating math every second, just check the pre-calculated variable.
    // However, if it hits exactly midnight, we should double check the state.
    if (now.getHours() === 0 && now.getMinutes() === 0 && now.getSeconds() === 0) {
      updateSolarData(now);
    } else {
      rootBody.classList.toggle('dim', isNightTime);
    }
  }

  // Inside your DOMContentLoaded block:
  document.addEventListener('DOMContentLoaded', () => {
    // Run everything immediately on load
    updateSolarData(); 
    updateClock();
    updateWeather();

    // Set intervals appropriately
    setInterval(updateClock, 1000);              // Clock ticking every second
    setInterval(updateSolarData, 60 * 60 * 1000); // Recalculate sun times once every hour
    setInterval(updateWeather, 30 * 60 * 1000);   // Fetch weather every 30 minutes
  });

    
  </script>
</body>
</html>
